name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      # No `version:` — action-setup@v4 reads it from package.json's
      # `packageManager` field (currently pinned to 11.3.0). Setting it
      # here was conflicting with the pin and failing the job.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  api:
    name: API (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -v

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [api]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: "frameboard"
          POSTGRES_PASSWORD: "frameboard"
          POSTGRES_DB: "frameboard"
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Match web job: no explicit version, use packageManager pin.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API deps
        working-directory: apps/api
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -e ".[dev]"

      - name: Run migrations
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql+psycopg://frameboard:frameboard@localhost:5433/frameboard"
        run: |
          source .venv/bin/activate
          alembic upgrade head

      - name: Start API
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql+psycopg://frameboard:frameboard@localhost:5433/frameboard"
          FRAMEBOARD_TEST_MODE: "1"
          API_CORS_ORIGINS: "http://localhost:3000"
          # E2E exercises the API directly via fetch without minting JWTs.
          # AUTH_DISABLED makes the backend trust requests under DEV_USER_EMAIL,
          # matching the same contract the conftest uses for unit tests.
          AUTH_DISABLED: "1"
          DEV_USER_EMAIL: "61649060+james-kanghj@users.noreply.github.com"
        run: |
          source .venv/bin/activate
          nohup uvicorn app.main:app --port 8001 > /tmp/api.log 2>&1 &
          sleep 3
          curl -sf http://localhost:8001/health || (echo "API failed to start" && cat /tmp/api.log && exit 1)

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @frameboard/web exec playwright install --with-deps chromium

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8001"
          NEXT_PUBLIC_DEV_USER_EMAIL: "61649060+james-kanghj@users.noreply.github.com"
          # NextAuth's auth.ts throws at import time without a secret —
          # any non-empty value is fine for the disabled-auth bypass.
          NEXTAUTH_SECRET: "ci-dummy-secret-not-used"
          NEXT_PUBLIC_AUTH_DISABLED: "1"
        run: pnpm --filter @frameboard/web build

      - name: Run E2E tests
        env:
          CI: "1"
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8001"
          NEXT_PUBLIC_DEV_USER_EMAIL: "61649060+james-kanghj@users.noreply.github.com"
          PLAYWRIGHT_API_URL: "http://localhost:8001"
          E2E_USER_EMAIL: "61649060+james-kanghj@users.noreply.github.com"
          # Mirror the build-time vars so `next dev` (which Playwright's
          # webServer launches) picks the same disabled-auth path.
          NEXTAUTH_SECRET: "ci-dummy-secret-not-used"
          NEXT_PUBLIC_AUTH_DISABLED: "1"
        run: pnpm --filter @frameboard/web e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
