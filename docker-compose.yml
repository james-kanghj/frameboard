services:
  db:
    image: postgres:16-alpine
    container_name: frameboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: frameboard
      POSTGRES_PASSWORD: frameboard
      POSTGRES_DB: frameboard
    ports:
      - "5433:5432"
    volumes:
      - frameboard-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frameboard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frameboard-db-data:
